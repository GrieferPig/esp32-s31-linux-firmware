name: Firmware

on:
  push:
    branches: [main]
    tags: ['fw-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash ci/checkout.sh
      - name: Check scripts and package regression tests
        run: |
          bash -n ci/checkout.sh ci/setup.sh ci/build.sh
          python3 -m py_compile ci/metadata.py
          python3 -m unittest discover -s source/tools/build/tests -p test_firmware_package.py -v

  build:
    needs: checks
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/fw-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check distribution boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
      - run: bash ci/checkout.sh
      - run: bash ci/setup.sh
      - run: bash ci/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/fw-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-${{ github.sha }}
          path: dist
      - name: Publish verified engineering package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
