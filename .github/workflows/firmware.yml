name: Firmware

on:
  push:
    branches: [main]
    tags: ['fw-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash ci/checkout.sh
      - name: Check scripts and package regression tests
        run: |
          for script in ci/checkout.sh ci/setup.sh ci/build.sh; do bash -n "$script"; done
          python3 -m py_compile tools/build/firmware_package.py
          python3 ci/check_independence.py
          python3 -m unittest discover -s tools/build/tests -p test_firmware_package.py -v

  build:
    needs: checks
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/fw-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash ci/checkout.sh
      - run: bash ci/setup.sh
      - name: Build and package S31 and P4 firmware
        run: bash ci/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            dist/SHA256SUMS
            dist/s31-firmware-inputs.tar
            dist/p4-firmware-inputs.tar
            dist/firmware-inputs.json
            dist/THIRD_PARTY_NOTICES.md
            dist/RADIO_BUNDLE_LICENSES.md
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/fw-v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-${{ github.sha }}
          path: dist
      - name: Publish verified firmware inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes ""
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
